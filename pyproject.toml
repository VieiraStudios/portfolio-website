[project]
name = "portfolio-website"
version = "0.1.0"
description = "Vieira Studios portfolio website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytailwindcss>=0.4.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
